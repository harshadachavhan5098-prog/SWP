{% extends 'base.html' %}{% block title %}Upload resource · SWP{% endblock %}{% block content %}<section class="content-page narrow"><header class="page-heading"><p class="eyebrow">CONTRIBUTE</p><h1>Add to the learning library</h1></header><form method="post" enctype="multipart/form-data" class="panel compose-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Resource file<input type="file" name="file" accept="image/png,image/jpeg,image/webp,application/pdf,text/plain,text/markdown" required></label><label>Title<input name="title" maxlength="160"></label><label>Description<textarea name="description" maxlength="1000"></textarea></label><label>Category<input name="category" maxlength="60" placeholder="Programming, Design, Mathematics"></label><label>Skill tags<input name="skills" maxlength="300" placeholder="Python, Data Science"></label><label>Visibility<select name="visibility"><option value="public">Public library</option><option value="private">Only me</option></select></label><button>Publish resource</button></form></section>{% endblock %}
