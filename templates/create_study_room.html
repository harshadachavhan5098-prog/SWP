{% extends 'base.html' %}{% block title %}Create study room · SWP{% endblock %}{% block content %}<section class="content-page narrow"><header class="page-heading"><p class="eyebrow">FOCUS TOGETHER</p><h1>Create a virtual study room</h1><p>Open a quiet, camera-free room where learners can read, write, set a timer, and use minimal chat.</p></header>{% if error %}<p class="flash error">{{ error }}</p>{% endif %}<form method="post" class="panel compose-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Room name<input name="title" required maxlength="80" placeholder="Deep work: Python fundamentals"></label><label>Purpose<textarea name="description" maxlength="300" placeholder="What are learners focusing on?"></textarea></label><div class="form-grid"><label>Focus minutes<input type="number" name="focus_minutes" min="5" max="180" value="50" required></label><label>Break minutes<input type="number" name="break_minutes" min="1" max="60" value="10" required></label></div><button>Create study room</button></form></section>{% endblock %}
