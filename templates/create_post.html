{% extends 'base.html' %}{% block title %}Create post · SWP{% endblock %}{% block content %}<section class="content-page narrow"><div class="page-heading"><p class="eyebrow">SHARE KNOWLEDGE</p><h1>Create a learning post</h1><p>Post a useful insight, an image, a PDF, or a note for your learning circle.</p></div><form class="panel compose-form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Caption<textarea name="caption" maxlength="2200" placeholder="What did you learn, teach, or discover today?"></textarea></label><label>Images, PDFs, or notes<input type="file" name="attachments" multiple accept="image/png,image/jpeg,image/webp,application/pdf,text/plain,text/markdown"></label><label>Skill tags<input name="skills" maxlength="300" placeholder="Python, Machine Learning, UI/UX"></label><label>Who can see this?<select name="visibility"><option value="public">Everyone on SWP</option><option value="friends">Friends only</option></select></label><button>Publish post</button></form></section>{% endblock %}
